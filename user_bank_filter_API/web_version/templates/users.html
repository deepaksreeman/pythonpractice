<!DOCTYPE html>
<html>
<head>
    <title>All Users</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>👥 All Users</h1>

    {% for user in users %}

<div class="card">

    <h3>{{ user["firstName"] }}</h3>

    <p>Username: {{ user["username"] }}</p>
    <p>Email: {{ user["email"] }}</p>
    <p>Currency: {{ user["bank"]["currency"] }}</p>

</div>

{% endfor %}

    <br>

    <a href="/">⬅ Back</a>

</body>
</html>
